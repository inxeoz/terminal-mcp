[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "i4z-terminal-mcp"
version = "0.5.3"
description = "MCP server for persistent interactive terminal orchestration"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pexpect>=4.8",
]

[project.scripts]
i4z-terminal-mcp = "terminal.server:main"

[tool.hatch.build.targets.wheel]
packages = ["terminal"]
